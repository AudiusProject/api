    track_access_info:
      required:
        - blocknumber
        - user_id
      type: object
      properties:
        access:
          type: object
          description: Describes what access the given user has
          allOf:
            - $ref: "#/components/schemas/access"
        user_id:
          type: string
          description: The user ID of the owner of this track
        blocknumber:
          type: integer
          description: The blocknumber this track was last updated
        is_stream_gated:
          type: boolean
          description:
            Whether or not the owner has restricted streaming behind an
            access gate
        stream_conditions:
          type: object
          description: How to unlock stream access to the track
          allOf:
            - $ref: "#/components/schemas/extended_access_gate"
        is_download_gated:
          type: boolean
          description:
            Whether or not the owner has restricted downloading behind
            an access gate
        download_conditions:
          type: object
          description: How to unlock the track download
          allOf:
            - $ref: "#/components/schemas/extended_access_gate"
    extended_access_gate:
      oneOf:
        - $ref: "#/components/schemas/tip_gate"
        - $ref: "#/components/schemas/follow_gate"
        - $ref: "#/components/schemas/extended_purchase_gate"
        - $ref: "#/components/schemas/token_gate"
    tip_gate:
      required:
        - tip_user_id
      type: object
      properties:
        tip_user_id:
          type: integer
          example: 1234
          description: Must tip the given user ID to unlock
    follow_gate:
      required:
        - follow_user_id
      type: object
      properties:
        follow_user_id:
          type: integer
          example: 1234
          description: Must follow the given user ID to unlock
    token_gate:
      required:
        - token_gate
      type: object
      properties:
        token_gate:
          type: object
          description: Must hold an NFT of the given collection to unlock
          allOf:
            - $ref: "#/components/schemas/extended_token_gate"
    extended_token_gate:
      required:
        - token_mint
        - token_amount
      type: object
      properties:
        token_mint:
          type: string
          description: The mint of the token needed to unlock
        token_amount:
          type: integer
          description: The amount of the token needed to unlock
    extended_purchase_gate:
      required:
        - usdc_purchase
      type: object
      properties:
        usdc_purchase:
          type: object
          description:
            Must pay the total price and split to the given addresses to
            unlock
          allOf:
            - $ref: "#/components/schemas/extended_usdc_gate"
    extended_usdc_gate:
      required:
        - price
        - splits
      type: object
      properties:
        price:
