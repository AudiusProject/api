  /rewards/claim:
    post:
      tags:
        - rewards
      description: Claims all the filtered undisbursed rewards for a user
      operationId: Claim Rewards
      requestBody:
        x-codegen-request-body-name: reward
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/claim_rewards_request_body"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/claim_rewards_response"
        "400":
          description: Bad request - No rewards to claim or invalid parameters
          content: {}
        "500":
          description: Server error
          content: {}
  /rewards/code:
    post:
      tags:
        - rewards
      description: Creates a new reward code with Solana signature verification
      operationId: Create Reward Code
      requestBody:
        x-codegen-request-body-name: body
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/create_reward_code_request_body"
      responses:
        "201":
          description: Created - Reward code successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/create_reward_code_response"
        "400":
          description: Bad request - Invalid signature format or missing required fields
          content: {}
        "403":
          description: Forbidden - Signature verification failed
          content: {}
        "500":
          description: Server error
          content: {}
  /prizes:
    get:
      tags:
        - prizes
      operationId: Get Prizes
      description: "Gets a list of active prizes available for claiming. Excludes sensitive information like download URLs."
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/prizes_response"
        "500":
          description: Server error
          content: {}
  /prizes/claim:
    post:
      tags:
        - prizes
      operationId: Claim Prize
      description: "Claims a prize by verifying a Solana transaction. User must send exactly 2 YAK to the prize receiver address. Returns the prize won and any redeem codes/URLs."
      requestBody:
        x-codegen-request-body-name: claim
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/prize_claim_request_body"
      responses:
        "200":
          description: Success - Prize claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/prize_claim_response"
        "400":
          description: Bad request - Transaction not found, invalid, or signature already used
          content: {}
        "500":
          description: Server error
          content: {}
  /wallet/{wallet}/prizes:
    get:
      tags:
        - prizes
      operationId: Get Wallet Prizes
      description: "Gets all claimed prizes for a wallet. Public endpoint - no authentication required. Excludes sensitive action_data for security."
      parameters:
        - name: wallet
          in: path
          description: The wallet address to get prizes for
          required: true
          schema:
            type: string
            example: "HLnpSz9h2S4hiLQ43rnSD9XkcUThA7B8hQMKmDaiTLcC"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/claimed_prizes_response"
        "400":
          description: Bad request - Missing wallet parameter
          content: {}
        "500":
          description: Server error
          content: {}

