openapi: 3.0.1
info:
  title: API
  description: Audius V1 API
  version: "1.0"
servers:
  - url: /v1
tags:
  - name: users
    description: User related operations
  - name: playlists
    description: Playlist related operations
  - name: tracks
    description: Track related operations
  - name: challenges
    description: Challenge related operations
  - name: tips
    description: Tip related operations
  - name: developer_apps
    description: Developer app related operations
  - name: dashboard_wallet_users
    description: Protocol dashboard wallet users related operations
  - name: resolve
    description: Audius Cannonical URL resolver
  - name: comments
    description: Comment related operations
  - name: events
    description: Events related operations
  - name: explore
    description: Explore related operations
  - name: rewards
    description: Rewards related operations
  - name: prizes
    description: Prize claiming related operations
paths:
  /challenges/undisbursed:
    get:
      tags:
        - challenges
      description: Get all undisbursed challenges
      operationId: Get Undisbursed Challenges
      parameters:
        - name: offset
          in: query
          description:
            The number of items to skip. Useful for pagination (page number
            * limit)
          schema:
            type: integer
        - name: limit
          in: query
          description: The number of items to fetch
          schema:
            type: integer
        - name: user_id
          in: query
          description:
            A User ID to filter the undisbursed challenges to a particular
            user
          schema:
            type: string
        - name: completed_blocknumber
          in: query
          description: Starting blocknumber to retrieve completed undisbursed challenges
          schema:
            type: integer
        - name: challenge_id
          in: query
          description:
            A challenge ID to filter the undisbursed challenges to a particular
            challenge
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/undisbursed_challenges"
        "400":
          description: Bad request
          content: {}
        "500":
          description: Server error
          content: {}
  /challenges/undisbursed/{user_id}:
    get:
      tags:
        - challenges
      description: Get all undisbursed challenges for a user
      operationId: Get Undisbursed Challenges For User
      parameters:
        - name: user_id
          in: path
          description:
            A User ID to filter the undisbursed challenges to a particular
            user
          required: true
          schema:
            type: string
        - name: offset
          in: query
          description:
            The number of items to skip. Useful for pagination (page number
            * limit)
          schema:
            type: integer
        - name: limit
          in: query
          description: The number of items to fetch
          schema:
            type: integer
        - name: completed_blocknumber
          in: query
          description: Starting blocknumber to retrieve completed undisbursed challenges
          schema:
            type: integer
        - name: challenge_id
          in: query
          description:
            A challenge ID to filter the undisbursed challenges to a particular
            challenge
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/undisbursed_challenges"
        "400":
          description: Bad request
          content: {}
        "500":
          description: Server error
          content: {}
  /comments/unclaimed_id:
    get:
      tags:
        - comments
      description: Gets an unclaimed blockchain comment ID
      operationId: Get unclaimed comment ID
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/unclaimed_id_response"
        "500":
          description: Server error
          content: {}
  /comments:
    post:
      tags:
        - comments
      description: Creates a new comment
      operationId: Create Comment
      security:
        - BasicAuth: []
        - BearerAuth: []
      parameters:
        - name: user_id
          in: query
          description: The user ID of the user making the request
          required: true
          schema:
            type: string
      requestBody:
        x-codegen-request-body-name: metadata
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/create_comment_request_body"
      responses:
        "201":
          description: Comment created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/create_comment_response"
        "400":
          description: Bad request
          content: {}
        "401":
          description: Unauthorized
          content: {}
        "500":
          description: Server error
          content: {}
  /comments/{comment_id}:
    get:
      tags:
        - comments
      description: Gets a comment by ID
      operationId: Get Comment
      parameters:
        - name: comment_id
          in: path
          description: A Comment ID
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/comment_response"
        "500":
          description: Server error
          content: {}
    put:
      tags:
        - comments
      description: Updates a comment
      operationId: Update Comment
      security:
        - BasicAuth: []
        - BearerAuth: []
      parameters:
        - name: comment_id
          in: path
          description: A Comment ID
          required: true
          schema:
            type: string
        - name: user_id
          in: query
          description: The user ID of the user making the request
          required: true
          schema:
            type: string
      requestBody:
        x-codegen-request-body-name: metadata
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/update_comment_request_body"
      responses:
        "200":
          description: Comment updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/write_response"
        "401":
          description: Unauthorized
          content: {}
        "404":
          description: Comment not found
          content: {}
        "500":
          description: Server error
          content: {}
    delete:
      tags:
        - comments
      description: Deletes a comment
      operationId: Delete Comment
      security:
        - BasicAuth: []
        - BearerAuth: []
      parameters:
        - name: comment_id
          in: path
          description: A Comment ID
          required: true
          schema:
            type: string
        - name: user_id
          in: query
          description: The user ID of the user making the request
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Comment deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/write_response"
        "401":
          description: Unauthorized
          content: {}
        "404":
          description: Comment not found
          content: {}
        "500":
          description: Server error
          content: {}
  /comments/{comment_id}/react:
    post:
      tags:
        - comments
      description: React to a comment
      operationId: React to Comment
      security:
        - BasicAuth: []
        - BearerAuth: []
      parameters:
        - name: comment_id
          in: path
          description: A Comment ID
          required: true
          schema:
            type: string
        - name: user_id
          in: query
          description: The user ID of the user making the request
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/react_comment_request_body"
        required: true
        x-codegen-request-body-name: metadata
      responses:
        "200":
          description: Comment reacted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/write_response"
        "401":
          description: Unauthorized
          content: {}
        "404":
          description: Comment not found
          content: {}
        "500":
          description: Server error
          content: {}
    delete:
      tags:
        - comments
      description: Unreact to a comment
      operationId: Unreact to Comment
      security:
        - BasicAuth: []
        - BearerAuth: []
      parameters:
        - name: comment_id
          in: path
          description: A Comment ID
          required: true
          schema:
            type: string
        - name: user_id
          in: query
          description: The user ID of the user making the request
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/react_comment_request_body"
        required: true
        x-codegen-request-body-name: metadata
      responses:
        "200":
          description: Comment unreacted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/write_response"
        "401":
          description: Unauthorized
          content: {}
        "404":
          description: Comment not found
          content: {}
        "500":
          description: Server error
          content: {}
  /comments/{comment_id}/pin:
    post:
      tags:
        - comments
      description: Pin a comment
      operationId: Pin Comment
      security:
        - BasicAuth: []
        - BearerAuth: []
      parameters:
        - name: comment_id
          in: path
          description: A Comment ID
          required: true
          schema:
            type: string
        - name: user_id
          in: query
          description: The user ID of the user making the request
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/pin_comment_request_body"
        required: true
        x-codegen-request-body-name: metadata
      responses:
        "200":
          description: Comment pinned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/write_response"
        "401":
          description: Unauthorized
          content: {}
        "404":
          description: Comment not found
          content: {}
        "500":
          description: Server error
          content: {}
    delete:
      tags:
        - comments
      description: Unpin a comment
      operationId: Unpin Comment
      security:
        - BasicAuth: []
        - BearerAuth: []
      parameters:
        - name: comment_id
          in: path
          description: A Comment ID
          required: true
          schema:
            type: string
        - name: user_id
          in: query
          description: The user ID of the user making the request
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/pin_comment_request_body"
        required: true
        x-codegen-request-body-name: metadata
      responses:
        "200":
          description: Comment unpinned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/write_response"
        "401":
          description: Unauthorized
          content: {}
        "404":
          description: Comment not found
          content: {}
        "500":
          description: Server error
          content: {}
  /comments/{comment_id}/report:
    post:
      tags:
        - comments
      description: Report a comment
      operationId: Report Comment
      security:
        - BasicAuth: []
        - BearerAuth: []
      parameters:
        - name: comment_id
          in: path
          description: A Comment ID
          required: true
          schema:
            type: string
        - name: user_id
          in: query
          description: The user ID of the user making the request
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Comment reported successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/write_response"
        "401":
          description: Unauthorized
          content: {}
        "404":
          description: Comment not found
          content: {}
        "500":
          description: Server error
          content: {}
  /comments/{comment_id}/replies:
    get:
      tags:
        - comments
      description: Gets replies to a parent comment
      operationId: Get Comment Replies
      parameters:
        - name: comment_id
          in: path
          description: A Comment ID
          required: true
          schema:
            type: string
        - name: offset
          in: query
          description:
            The number of items to skip. Useful for pagination (page number
            * limit)
          schema:
            type: integer
        - name: limit
          in: query
          description: The number of items to fetch
          schema:
            type: integer
        - name: user_id
          in: query
          description: The user ID of the user making the request
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/comment_replies_response"
        "400":
          description: Bad request
          content: {}
        "500":
          description: Server error
          content: {}
  /developer-apps:
    post:
      tags:
        - developer_apps
      description: Create a new developer app. Indexer validates grants.
      operationId: Create Developer App
      parameters:
        - name: user_id
          in: query
          description: The user ID of the user creating the developer app
          required: true
          schema:
            type: string
      requestBody:
        x-codegen-request-body-name: metadata
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/create_developer_app_request_body"
      responses:
        "200":
          description: Developer app created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/create_developer_app_response"
        "400":
          description: Bad request
          content: {}
        "401":
          description: Unauthorized
          content: {}
        "500":
          description: Server error
          content: {}
  /developer-apps/{address}:
    get:
      tags:
        - developer_apps
      description: Gets developer app matching given address (API key)
      operationId: Get Developer App
      parameters:
        - name: address
          in: path
          description: A developer app address (API Key)
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/developer_app_response"
        "400":
          description: Bad request
          content: {}
        "404":
          description: Not found
          content: {}
        "500":
          description: Server error
          content: {}
    delete:
      tags:
        - developer_apps
      description: Deletes a developer app. Indexer validates grants.
      operationId: Delete Developer App
      parameters:
        - name: user_id
          in: query
          description: The user ID of the user who owns the developer app
          required: true
          schema:
            type: string
        - name: address
          in: path
          description: Developer app address (API Key)
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Developer app deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/write_response"
        "401":
          description: Unauthorized
          content: {}
        "404":
          description: Not found
          content: {}
        "500":
          description: Server error
          content: {}
    put:
      tags:
        - developer_apps
      description: Updates a developer app. Indexer validates grants.
      operationId: Update Developer App
      parameters:
        - name: user_id
          in: query
          description: The user ID of the user who owns the developer app
          required: true
          schema:
            type: string
        - name: address
          in: path
          description: Developer app address (API Key)
          required: true
          schema:
            type: string
      requestBody:
        x-codegen-request-body-name: metadata
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/update_developer_app_request_body"
      responses:
        "200":
          description: Developer app updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/write_response"
        "400":
          description: Bad request
          content: {}
        "401":
          description: Unauthorized
          content: {}
        "404":
          description: Developer app not found
          content: {}
        "500":
          description: Server error
          content: {}
  /developer-apps/{address}/access-keys/deactivate:
    post:
      tags:
        - developer_apps
      description: Deactivate a bearer token (API access key) for a developer app. Indexer validates grants.
      operationId: Deactivate Developer App Access Key
      parameters:
        - name: user_id
          in: query
          description: The user ID of the user who owns the developer app
          required: true
          schema:
            type: string
        - name: address
          in: path
          description: Developer app address (API Key)
          required: true
          schema:
            type: string
      requestBody:
        x-codegen-request-body-name: metadata
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/deactivate_access_key_request_body"
      responses:
        "200":
          description: Access key deactivated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/deactivate_access_key_response"
        "400":
          description: Bad request (api_access_key required)
          content: {}
        "401":
          description: Unauthorized
          content: {}
        "404":
          description: Developer app or access key not found
          content: {}
        "500":
          description: Server error
          content: {}
  /developer-apps/{address}/access-keys:
    post:
      tags:
        - developer_apps
      description: Create a new bearer token (API access key) for a developer app. Indexer validates grants.
      operationId: Create Developer App Access Key
      parameters:
        - name: user_id
          in: query
          description: The user ID of the user who owns the developer app
          required: true
          schema:
            type: string
        - name: address
          in: path
          description: Developer app address (API Key)
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Access key created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/create_access_key_response"
        "401":
          description: Unauthorized
          content: {}
        "404":
          description: Developer app not found
          content: {}
        "500":
          description: Server error
          content: {}
  /dashboard_wallet_users:
    get:
      tags:
        - dashboard_wallet_users
      description: Gets Audius user profiles connected to given dashboard wallet addresses
      operationId: Bulk get dashboard wallet users
      parameters:
        - name: wallets
          in: query
          description: The wallets for which to fetch connected Audius user profiles.
          required: true
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/dashboard_wallet_users_response"
        "400":
          description: Bad request
          content: {}
        "404":
          description: No such dashboard wallets
          content: {}
        "500":
          description: Server error
          content: {}
  /events:
    get:
      tags:
        - events
      description: Get a list of events by ID
      operationId: Get Bulk Events
      parameters:
        - name: user_id
          in: query
          description: The user ID of the user making the request
          schema:
            type: string
        - name: id
          in: query
          description: The ID of the event(s) to retrieve
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: event_type
          in: query
          description: The type of event to filter by
          schema:
            type: string
            enum:
              - remix_contest
              - live_event
              - new_release
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/events_response"
        "400":
          description: Bad request
          content: {}
        "500":
          description: Server error
          content: {}
  /events/all:
    get:
      tags:
        - events
      summary: Get all events
      description: Get all events
      operationId: Get All Events
      parameters:
        - name: offset
          in: query
          description:
            The number of items to skip. Useful for pagination (page number
            * limit)
          schema:
            type: integer
        - name: limit
          in: query
          description: The number of items to fetch
          schema:
            type: integer
        - name: user_id
          in: query
          description: The user ID of the user making the request
          schema:
            type: string
        - name: sort_method
          in: query
          description: The sort method
          schema:
            type: string
            default: newest
            enum:
              - newest
              - timestamp
        - name: event_type
          in: query
          description: The type of event to filter by
          schema:
            type: string
            enum:
              - remix_contest
              - live_event
              - new_release
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/events_response"
        "400":
          description: Bad request
          content: {}
        "500":
          description: Server error
          content: {}
  /events/entity:
    get:
      tags:
        - events
      summary: Get events for a specific entity
      description: Get events for a specific entity
      operationId: Get Entity Events
      parameters:
        - name: offset
          in: query
          description:
            The number of items to skip. Useful for pagination (page number
            * limit)
          schema:
            type: integer
        - name: limit
          in: query
          description: The number of items to fetch
          schema:
            type: integer
        - name: user_id
          in: query
          description: The user ID of the user making the request
          schema:
            type: string
        - name: entity_id
          in: query
          description: The ID of the entity to get events for
          required: true
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: entity_type
          in: query
          description: The type of entity to get events for
          schema:
            type: string
            enum:
              - track
              - collection
              - user
        - name: filter_deleted
          in: query
          description: Whether to filter deleted events
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/events_response"
        "400":
          description: Bad request
          content: {}
        "500":
          description: Server error
          content: {}
  /events/unclaimed_id:
    get:
      tags:
        - events
      description: Gets an unclaimed blockchain event ID
      operationId: Get unclaimed event ID
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/unclaimed_id_response"
        "500":
          description: Server error
          content: {}
  /explore/best-selling:
    get:
      tags:
        - explore
      summary: Get best selling tracks and/or albums
      description: Get best selling tracks and playlists
      operationId: Get Best Selling
      parameters:
        - name: offset
          in: query
          description:
            The number of items to skip. Useful for pagination (page number
            * limit)
          schema:
            type: integer
        - name: limit
          in: query
          description: The number of items to fetch
          schema:
            type: integer
        - name: user_id
          in: query
          description: The user ID of the user making the request
          schema:
            type: string
        - name: type
          in: query
          description: The type of content to filter by
          schema:
            type: string
            default: all
            enum:
              - all
              - track
              - album
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/best_selling_response"
        "400":
          description: Bad request
          content: {}
        "500":
          description: Server error
          content: {}
  /playlists:
    get:
      tags:
        - playlists
      description: Gets a list of playlists by ID
      operationId: Get Bulk Playlists
      parameters:
        - name: user_id
          in: query
          description: The user ID of the user making the request
          schema:
            type: string
        - name: id
          in: query
          description: The ID of the playlist(s)
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: upc
          in: query
          description: The UPC of the playlist(s)
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/playlist_response"
        "400":
          description: Bad request
          content: {}
        "500":
          description: Server error
          content: {}
    post:
      tags:
        - playlists
      description: Creates a new playlist or album
      operationId: Create Playlist
      security:
        - BasicAuth: []
        - BearerAuth: []
      parameters:
        - name: user_id
          in: query
          description: The user ID of the user making the request
          required: true
          schema:
            type: string
      requestBody:
        x-codegen-request-body-name: metadata
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/create_playlist_request_body"
