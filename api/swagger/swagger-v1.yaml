          schema:
            type: integer
            default: 0
        - name: receiver_is_verified
          in: query
          description: Only include tips to recipients that are verified
          schema:
            type: boolean
            default: false
        - name: current_user_follows
          in: query
          description:
            Only include tips involving the user's followers in the given
            capacity. Requires user_id to be set.
          schema:
            type: string
            enum:
              - sender
              - receiver
              - sender_or_receiver
        - name: unique_by
          in: query
          description:
            "Only include the most recent tip for a user was involved in\
            \ the given capacity.\n\nEg. 'sender' will ensure that each tip returned\
            \ has a unique sender, using the most recent tip sent by a user if that\
            \ user has sent multiple tips.\n    "
          schema:
            type: string
            enum:
              - sender
              - receiver
        - name: min_slot
          in: query
          description: The minimum Solana slot to pull tips from
          schema:
            type: integer
            default: 0
        - name: max_slot
          in: query
          description: The maximum Solana slot to pull tips from
          schema:
            type: integer
            default: 0
        - name: tx_signatures
          in: query
          description: A list of transaction signatures of tips to fetch
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get_tips_response"
